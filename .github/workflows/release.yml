name: Create Release on changelog update
on:
  push:
    branches:
      - main
    paths:
      - 'changelog.html'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install beautifulsoup4
      - name: Parse changelog
        id: parse
        run: python .github/scripts/parse_changelog.py
      - name: Start server and run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: 'http://localhost:8080/index.html'
          startServerCommand: 'python -m http.server 8080'
          uploadArtifacts: true
          temporaryPublicStorage: true
          continue-on-error: true
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.parse.outputs.version }}
          name: ${{ steps.parse.outputs.version }} · ${{ steps.parse.outputs.date }}
          body: ${{ steps.parse.outputs.body }}
          prerelease: ${{ steps.parse.outputs.prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}