name: Create Release on changelog update
on:
  push:
    branches:
      - main
    paths:
      - 'changelog.html'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install beautifulsoup4
      - name: Parse changelog
        id: parse
        run: python .github/scripts/parse_changelog.py
      - name: Check if tag exists
        id: tag_exists
        run: |
          if git ls-remote --tags origin ${{ steps.parse.outputs.version }} | grep -q ${{ steps.parse.outputs.version }}; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Create and push tag
        if: steps.tag_exists.outputs.exists == 'false'
        run: |
          git tag ${{ steps.parse.outputs.version }}
          git push origin ${{ steps.parse.outputs.version }}
      - name: Start HTTP server
        run: |
          python -m http.server 8080 &
          sleep 3
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: 'http://localhost:8080/index.html'
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.parse.outputs.version }}
          name: ${{ steps.parse.outputs.version }}
          body: ${{ steps.parse.outputs.body }}
          prerelease: ${{ steps.parse.outputs.prerelease }}
          files: index.html
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete empty tags
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' > releases.txt
          git tag -l > tags.txt
          while read tag; do
            if ! grep -qx "$tag" releases.txt; then
              echo "Deleting empty tag: $tag"
              git tag -d "$tag"
              git push origin :refs/tags/"$tag" || true
            fi
          done < tags.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}